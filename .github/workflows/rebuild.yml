# Reconstruction du stock à partir d'un jour futur (filtre de tirage ou liste de candidats modifiés : la chaîne de mots change à partir de là). DÉPÔT PUBLIC :
# le journal ne contient que des nombres (jours refaits, jours dont le mot change), jamais un mot. Lancement manuel UNIQUEMENT. Même verrou que stock.yml.
name: rebuild
on:
  workflow_dispatch:
    inputs:
      from_number:
        description: "Premier jour à refaire (> jour courant)"
        type: string
      dry_run:
        description: "Aperçu : refait les jours en local et compte ceux qui changent, n'écrit rien dans R2"
        type: boolean
        default: true
permissions: {}
concurrency:
  group: stock
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - name: Dépendances
        run: pip install --quiet --disable-pip-version-check -r requirements.txt
      - name: Reconstruction du stock
        env:
          SEMANTIK_MASTER_KEY: ${{ secrets.SEMANTIK_MASTER_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DEPLOY_CHECK_TOKEN: ${{ secrets.DEPLOY_CHECK_TOKEN }}
          STOCK_REBUILD_FROM: ${{ inputs.from_number }}
          STOCK_REBUILD_REQUIRED: '1'  # sans numéro, ce workflow ne doit jamais se rabattre sur un run de stock ordinaire
          STOCK_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          STOCK_DAYS_AHEAD: '90'
        run: python stock_run.py
